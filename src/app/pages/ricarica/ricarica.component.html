<form (ngSubmit)="inviaRicarica()">

  @if (messaggioEsito) {
    <div style="padding: 12px; background: #d4edda; color: #155724; border-radius: 8px; margin-bottom: 15px;">
      {{ messaggioEsito }}
    </div>
  }
  @if (erroreEsito) {
    <div style="padding: 12px; background: #f8d7da; color: #721c24; border-radius: 8px; margin-bottom: 15px;">
      {{ erroreEsito }}
    </div>
  }

  <div class="form-group">
    <label for="phone">Numero di telefono</label>
    <input type="tel" id="phone" name="phone" [(ngModel)]="numeroTelefonico" placeholder="+39 333 1234567" required>
  </div>

  <div class="form-group">
    <label for="operator">Operatore</label>
    <select id="operator" name="operator" [(ngModel)]="operatore" required>
      <option value="">Seleziona operatore</option>
      <option value="iliad">Iliad</option>
      <option value="tim">TIM</option>
      <option value="vodafone">Vodafone</option>
      <option value="windtre">WindTre</option>
      <option value="fastweb">Fastweb</option>
    </select>
  </div>

  <div class="form-group">
    <label>Importo</label>
    <div class="amount-options">
      @for (t of [5, 10, 15, 20, 30]; track t) {
        <label class="amount-option">
          <input type="radio" name="amount" [value]="t" [(ngModel)]="taglio">
          <span>€ {{ t }}</span>
        </label>
      }
    </div>
  </div>

  <button type="submit" class="primary-button">
    Effettua ricarica
    <i class="fa-solid fa-arrow-right"></i>
  </button>

</form>
