<div class="page">

  <app-navbar></app-navbar>

  <main class="content">

    <h1>Ricarica Cellulare</h1>

    <div class="form-card">

      <div class="form-group">

        <label>Numero telefonico</label>

        <input
          type="tel"
          placeholder="3331234567">

      </div>

      <div class="form-group">

        <label>Operatore</label>

        <select>

          <option value="">Seleziona operatore</option>
          <option>TIM</option>
          <option>Vodafone</option>
          <option>Iliad</option>
          <option>WindTre</option>
          <option>Fastweb</option>

        </select>

      </div>

      <div class="form-group">

        <label>Importo ricarica</label>

        <select>

          <option value="">Seleziona importo</option>
          <option>€ 5</option>
          <option>€ 10</option>
          <option>€ 20</option>
          <option>€ 30</option>
          <option>€ 50</option>

        </select>

      </div>

      <button class="btn-primary">
        Effettua Ricarica
      </button>

    </div>

  </main>

</div>
