<div class="login-page">

  <div class="login-container">

    <div class="brand">

      <div class="brand-icon">
        €
      </div>

      <h1>MyBank</h1>

      <p>
        Gestione Conto Corrente
      </p>

    </div>

    <div class="login-card">

      <h2>Accedi al tuo conto</h2>

      <p class="login-description">
        Inserisci le tue credenziali per continuare.
      </p>

      <form>

        <div class="form-group">

          <label for="email">
            Email
          </label>

          <div class="input-container">

            <span>✉</span>

            <input
              id="email"
              type="email"
              placeholder="nome@email.it">

          </div>

        </div>

        <div class="form-group">

          <label for="password">
            Password
          </label>

          <div class="input-container">

            <span>🔒</span>

            <input
              id="password"
              type="password"
              placeholder="Inserisci la password">

          </div>

        </div>

        <button
          type="button"
          class="login-button"
          (click)="login()">

          Accedi

        </button>

      </form>

      <div class="register-section">

        <span>
          Non hai ancora un conto?
        </span>

        <a routerLink="/registrazione">
          Registrati
        </a>

      </div>

    </div>

    <div class="login-footer">

      <span>
        © 2026 MyBank
      </span>

      <span>
        Sistema di gestione conto corrente
      </span>

    </div>

  </div>

</div>
