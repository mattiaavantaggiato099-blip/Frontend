<div class="page">
  <div class="card register-card">
    <h1>Crea il tuo account</h1>

    <form
      [formGroup]="registerForm"
      (ngSubmit)="register()"
    >
      <div class="form-group">
        <label for="nome">
          Nome
        </label>

        <input
          id="nome"
          type="text"
          formControlName="nome"
          placeholder="Inserisci il tuo nome"
          autocomplete="given-name"
        />
      </div>

      <div class="form-group">
        <label for="cognome">
          Cognome
        </label>

        <input
          id="cognome"
          type="text"
          formControlName="cognome"
          placeholder="Inserisci il tuo cognome"
          autocomplete="family-name"
        />
      </div>

      <div class="form-group">
        <label for="email">
          Email
        </label>

        <input
          id="email"
          type="email"
          formControlName="email"
          placeholder="Inserisci la tua email"
          autocomplete="email"
        />
      </div>

      <!-- Password -->
      <div class="form-group">
        <label for="password">
          Password
        </label>

        <div class="password-input-wrapper">
          <input
            id="password"
            [type]="showPassword ? 'text' : 'password'"
            formControlName="password"
            placeholder="Inserisci una password"
            autocomplete="new-password"
          />
          <button
            type="button"
            class="toggle-password"
            (click)="showPassword = !showPassword"
            title="{{ showPassword ? 'Nascondi password' : 'Mostra password' }}"
          >
            <i
              class="la"
              [class.la-eye]="!showPassword"
              [class.la-eye-slash]="showPassword"
            ></i>
          </button>
        </div>
      </div>

      <!-- Conferma password -->
      <div class="form-group">
        <label for="confermaPassword">
          Conferma password
        </label>

        <div class="password-input-wrapper">
          <input
            id="confermaPassword"
            [type]="showPasswordConferma ? 'text' : 'password'"
            formControlName="confermaPassword"
            placeholder="Ripeti la password"
            autocomplete="new-password"
          />
          <button
            type="button"
            class="toggle-password"
            (click)="showPasswordConferma = !showPasswordConferma"
            title="{{ showPasswordConferma ? 'Nascondi password' : 'Mostra password' }}"
          >
            <i
              class="la"
              [class.la-eye]="!showPasswordConferma"
              [class.la-eye-slash]="showPasswordConferma"
            ></i>
          </button>
        </div>
      </div>

      @if (errorMessage()) {
        <div class="alert error">
          {{ errorMessage() }}
        </div>
      }

      <button
        type="submit"
        [disabled]="registerForm.invalid"
      >
        Registrati
      </button>
    </form>

    <div class="login-link">
      <span>Hai già un account?</span>

      <a routerLink="/login">
        Accedi
      </a>
    </div>
  </div>
</div>
