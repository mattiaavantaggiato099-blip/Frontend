<div class="page">

  <app-navbar></app-navbar>

  <main class="content">

    <div class="page-header">
      <h1>Nuovo Bonifico</h1>
      <p>Invia denaro ad un altro conto corrente.</p>
    </div>

    <div class="form-card">

      <div class="form-title">
        <div class="icon">
          €
        </div>

        <div>
          <h2>Effettua un bonifico</h2>
          <p>Compila tutti i campi richiesti</p>
        </div>
      </div>

      <div class="form-group">

        <label for="iban">
          IBAN destinatario
        </label>

        <input
          id="iban"
          type="text"
          placeholder="IT00X0000000000000000000000">

        <small>
          Inserisci l'IBAN del conto destinatario.
        </small>

      </div>

      <div class="form-group">

        <label for="importo">
          Importo
        </label>

        <div class="input-euro">
          <span>€</span>

          <input
            id="importo"
            type="number"
            min="0.01"
            step="0.01"
            placeholder="0,00">
        </div>

      </div>

      <div class="form-group">

        <label for="causale">
          Causale
        </label>

        <textarea
          id="causale"
          placeholder="Inserisci la causale del bonifico">
        </textarea>

      </div>

      <div class="available-balance">

        <span>Saldo disponibile</span>

        <strong>€ 2.450,75</strong>

      </div>

      <div class="form-actions">

        <button
          type="button"
          class="btn-secondary">

          Annulla

        </button>

        <button
          type="button"
          class="btn-primary">

          Effettua Bonifico

        </button>

      </div>

    </div>

  </main>

</div>
