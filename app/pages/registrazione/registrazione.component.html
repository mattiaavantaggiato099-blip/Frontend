<div class="register-page">

  <div class="register-card">

    <div class="logo">
      <h1>MyBank</h1>
      <p>Crea il tuo conto</p>
    </div>

    <h2>Registrazione</h2>

    <form>

      <div class="form-row">

        <div class="form-group">
          <label>Nome</label>
          <input type="text" placeholder="Mario">
        </div>

        <div class="form-group">
          <label>Cognome</label>
          <input type="text" placeholder="Rossi">
        </div>

      </div>

      <div class="form-group">
        <label>Email</label>
        <input type="email" placeholder="mario.rossi@email.it">
      </div>

      <div class="form-group">
        <label>Password</label>
        <input type="password" placeholder="Inserisci password">
      </div>

      <div class="password-info">
        <p>La password deve contenere:</p>
        <ul>
          <li>Almeno 8 caratteri</li>
          <li>Una lettera maiuscola</li>
          <li>Un simbolo</li>
        </ul>
      </div>

      <div class="form-group">
        <label>Conferma Password</label>
        <input type="password" placeholder="Ripeti password">
      </div>

      <button type="submit" class="btn-primary">
        Registrati
      </button>

    </form>

    <div class="register-footer">
      <p>Hai già un account?</p>
      <a href="#">Accedi</a>
    </div>

  </div>

</div>
