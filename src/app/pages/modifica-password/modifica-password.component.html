<div class="page">
  <div class="card">

    <h1>Modifica password</h1>

    <!-- Password attuale -->
    <div class="form-group">
      <label for="passwordAttuale">Password attuale</label>

      <div class="password-input-wrapper">
        <input
          id="passwordAttuale"
          name="passwordAttuale"
          [type]="showPasswordAttuale ? 'text' : 'password'"
          [(ngModel)]="passwordAttuale"
          placeholder="Inserisci password attuale"
          [disabled]="loading()"
        />
        <button
          type="button"
          class="toggle-password"
          (click)="showPasswordAttuale = !showPasswordAttuale"
          [disabled]="loading()"
          title="{{ showPasswordAttuale ? 'Nascondi password' : 'Mostra password' }}"
        >
          <i
            class="la"
            [class.la-eye]="!showPasswordAttuale"
            [class.la-eye-slash]="showPasswordAttuale"
          ></i>
        </button>
      </div>
    </div>

    <!-- Nuova password -->
    <div class="form-group">
      <label for="nuovaPassword">Nuova password</label>

      <div class="password-input-wrapper">
        <input
          id="nuovaPassword"
          name="nuovaPassword"
          [type]="showPasswordNuova ? 'text' : 'password'"
          [(ngModel)]="nuovaPassword"
          placeholder="Inserisci nuova password"
          [disabled]="loading()"
        />
        <button
          type="button"
          class="toggle-password"
          (click)="showPasswordNuova = !showPasswordNuova"
          [disabled]="loading()"
          title="{{ showPasswordNuova ? 'Nascondi password' : 'Mostra password' }}"
        >
          <i
            class="la"
            [class.la-eye]="!showPasswordNuova"
            [class.la-eye-slash]="showPasswordNuova"
          ></i>
        </button>
      </div>
    </div>

    <!-- Conferma nuova password -->
    <div class="form-group">
      <label for="confermaPassword">Conferma nuova password</label>

      <div class="password-input-wrapper">
        <input
          id="confermaPassword"
          name="confermaPassword"
          [type]="showPasswordConferma ? 'text' : 'password'"
          [(ngModel)]="confermaPassword"
          placeholder="Conferma nuova password"
          [disabled]="loading()"
        />
        <button
          type="button"
          class="toggle-password"
          (click)="showPasswordConferma = !showPasswordConferma"
          [disabled]="loading()"
          title="{{ showPasswordConferma ? 'Nascondi password' : 'Mostra password' }}"
        >
          <i
            class="la"
            [class.la-eye]="!showPasswordConferma"
            [class.la-eye-slash]="showPasswordConferma"
          ></i>
        </button>
      </div>
    </div>

    <button
      type="button"
      (click)="modificaPassword()"
      [disabled]="loading()"
    >
      @if (loading()) {
        Modifica in corso...
      } @else {
        Modifica password
      }
    </button>

    @if (messaggio()) {
      <div class="alert success">
        {{ messaggio() }}
      </div>
    }

    @if (errore()) {
      <div class="alert error">
        {{ errore() }}
      </div>
    }

  </div>
</div>
